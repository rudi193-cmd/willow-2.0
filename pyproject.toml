[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "willow"
version = "2.0.0"
description = "Willow 2.0 — local-first AI stack (Ollama by default)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11,<3.15"
dependencies = [
    "psycopg2-binary>=2.9.12",
    "pgvector>=0.5.0",
    "cryptography>=50.0.0",
    "requests>=2.34.2",
    "mcp>=2.0.0,<3.0.0",
    "litellm>=1.87.0; python_version < '3.14'",
    "litellm>=1.94.1,<1.95; python_version >= '3.14'",
    "textual>=8.2.8",
    "watchdog>=6.0.0",
    "starlette>=1.4.1",
    "uvicorn>=0.52.0",
    "aiohttp>=3.14.3",
    "psutil",
    "portalocker>=4.1.0",
    "platformdirs>=4.11.0",
    "pywin32>=312; sys_platform == 'win32'",
    "windows-curses>=2.4.2; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-timeout>=2.4.0",
    "ruff",
    "mypy",
    "coverage",
    "pre-commit>=4.6.1",
    "bandit>=1.9.4",
    "pdoc>=16.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (enterprise-scale, deselect with -m 'not slow')",
    "unit: fast isolated unit tests",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "sap*"]

[tool.ruff]
target-version = "py310"
extend-exclude = [
    "worktrees",
    "mcp-memory-service",
    "Ashokoa",
    "personal",
    "archive",
    "dashboard-fresh",
    ".kart-scripts",
    ".venv-dev",
    ".venv",
    "u2u",
    "willow/fylgja/bin/fylgja-hook",
]

[tool.ruff.lint.per-file-ignores]
# Intentional late imports after path/bootstrap or tool registration side effects.
"sap/sap_mcp.py" = ["E402"]
"sap/unified_mcp.py" = ["E402"]
"core/jeles_sources.py" = ["E402"]
"scripts/**" = ["E402"]
"tests/**" = ["E402"]
"willow/forks.py" = ["E402"]
"willow/fylgja/events/post_tool.py" = ["E402"]
"willow/fylgja/events/stop_slow.py" = ["E402"]
"willow/hooks/post_push.py" = ["E402"]

[tool.bandit]
exclude_dirs = [
    "tests",
    ".venv",
    ".venv-dev",
    "worktrees",
    "stubs",
    "archive",
    "mcp-memory-service",
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
explicit_package_bases = true
mypy_path = "stubs"
files = ["core", "sap", "willow"]
exclude = [
    "^u2u$",
    "worktrees/",
    "mcp-memory-service/",
    "Ashokoa/",
    "personal/",
    "archive/",
    ".kart-scripts/",
    "stubs/",
]
